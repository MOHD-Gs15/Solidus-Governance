name: Tests

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (SA2-027)

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1 (SA2-027)
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (SA2-027)
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: ./gradlew test

      - name: Coverage report (opt-in, non-blocking)
        run: ./gradlew testWithCoverage
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (SA2-027)
        if: always()
        continue-on-error: true
        with:
          name: jacoco-report
          path: build/reports/jacoco/

      - name: SpotBugs (non-blocking during the Java 25 toolchain shakeout)
        run: ./gradlew spotbugsMain
        continue-on-error: true

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (SA2-027)
        if: always()
        continue-on-error: true
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (SA2-027)
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
