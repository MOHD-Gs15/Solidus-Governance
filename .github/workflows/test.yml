name: Tests

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SA2-027)

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.0.1 (SA2-027)
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (SA2-027)
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: ./gradlew test

      - name: Coverage report (opt-in, non-blocking)
        run: ./gradlew testWithCoverage
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1 (SA2-027)
        if: always()
        continue-on-error: true
        with:
          name: jacoco-report
          path: build/reports/jacoco/

      - name: SpotBugs (non-blocking during the Java 25 toolchain shakeout)
        run: ./gradlew spotbugsMain
        continue-on-error: true

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1 (SA2-027)
        if: always()
        continue-on-error: true
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1 (SA2-027)
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
